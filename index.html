<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>animehub — v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <!-- ===== SIDEBAR ===== -->
  <aside class="side">
    <a class="logo" href="#" data-view="beranda">animehub<span>.</span></a>
    <nav class="side-nav">
      <button class="sn active" data-view="beranda"><i>◉</i>Beranda</button>
      <button class="sn" data-view="jelajah"><i>▦</i>Jelajah</button>
      <button class="sn" data-view="jadwal"><i>◷</i>Jadwal</button>
      <button class="sn" data-view="koleksi"><i>♡</i>Koleksiku <b id="wlCount">0</b></button>
    </nav>
    <p class="side-foot">mockup v2<br>konten placeholder</p>
  </aside>

  <!-- ===== MAIN ===== -->
  <main class="main">
    <header class="topbar">
      <label class="search"><span>⌕</span><input id="q" type="text" placeholder="Cari anime, donghua, manga…" autocomplete="off"></label>
    </header>

    <!-- BERANDA -->
    <section class="view active" id="view-beranda">
      <h2>Lanjutkan</h2>
      <div class="rail" id="continueRow"></div>
      <div class="sec-row"><h2>Trending minggu ini</h2><button class="more" data-view="jelajah">Lihat semua →</button></div>
      <div class="grid" id="trendGrid"></div>
      <h2>Tayang hari ini</h2>
      <div class="today" id="todayRow"></div>
    </section>

    <!-- JELAJAH -->
    <section class="view" id="view-jelajah">
      <h2>Jelajah</h2>
      <div class="chips" id="catChips">
        <button class="chip on" data-cat="semua">Semua</button>
        <button class="chip" data-cat="anime">Anime</button>
        <button class="chip" data-cat="donghua">Donghua</button>
        <button class="chip" data-cat="manga">Manga</button>
      </div>
      <p class="hint" id="jelajahHint" hidden></p>
      <div class="grid" id="allGrid"></div>
    </section>

    <!-- JADWAL -->
    <section class="view" id="view-jadwal">
      <h2>Jadwal rilis</h2>
      <div class="chips" id="dayChips"></div>
      <div class="sched" id="schedList"></div>
    </section>

    <!-- KOLEKSI -->
    <section class="view" id="view-koleksi">
      <h2>Koleksiku</h2>
      <p class="hint" id="wlHint">Judul yang kamu simpan muncul di sini.</p>
      <div class="grid" id="wlGrid"></div>
    </section>
  </main>

  <!-- ===== BOTTOM NAV (mobile) ===== -->
  <nav class="bottomnav">
    <button class="bn active" data-view="beranda">◉<small>Beranda</small></button>
    <button class="bn" data-view="jelajah">▦<small>Jelajah</small></button>
    <button class="bn" data-view="jadwal">◷<small>Jadwal</small></button>
    <button class="bn" data-view="koleksi">♡<small>Koleksi</small></button>
  </nav>
</div>

<!-- ===== DETAIL MODAL ===== -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="close" id="closeSheet">✕</button>
    <div class="sheet-top">
      <div class="sheet-art" id="sheetArt"></div>
      <div class="sheet-info">
        <span class="pill" id="sheetCat">ANIME</span>
        <h3 id="sheetTitle">Judul</h3>
        <p class="meta" id="sheetMeta">EP 24 • ★ 4.9</p>
        <p class="syn" id="sheetSyn"></p>
        <div class="sheet-actions">
          <button class="btn-primary" id="sheetWatch">▶ Mulai</button>
          <button class="btn-ghost" id="sheetSave">♡ Simpan</button>
        </div>
      </div>
    </div>
    <h4 id="epLabel">Episode</h4>
    <div class="eps" id="epList"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
