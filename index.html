<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>animehub — v5 feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="top">
  <span class="logo">animehub<span>.</span></span>
  <div class="top-right">
    <button class="tbtn" id="searchBtn" aria-label="Cari">⌕</button>
    <button class="tbtn" id="wlBtn" aria-label="Koleksi">♡<b id="wlCount">0</b></button>
  </div>
</nav>

<aside class="dots" id="dots"></aside>

<main class="feed" id="feed"></main>

<div class="hint" id="swipeHint">geser ke atas <span>↑</span></div>

<!-- SEARCH -->
<div class="soverlay" id="soverlay" hidden>
  <div class="sbox">
    <input id="sq" type="text" placeholder="Ketik judul…" autocomplete="off">
    <div class="sres" id="sres"></div>
  </div>
</div>

<!-- KOLEKSI -->
<div class="soverlay" id="wloverlay" hidden>
  <div class="sbox">
    <h3>Koleksiku</h3>
    <div class="sres" id="wlres"></div>
  </div>
</div>

<!-- DETAIL -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet">
    <button class="close" id="closeSheet">✕</button>
    <div class="sheet-bg" id="sheetBg"></div>
    <div class="sheet-body">
      <span class="pill" id="sheetCat">ANIME</span>
      <h3 id="sheetTitle"></h3>
      <p class="meta" id="sheetMeta"></p>
      <p class="syn" id="sheetSyn"></p>
      <div class="sheet-actions">
        <button class="btn-play" id="sheetWatch">▶ Mulai</button>
        <button class="btn-line" id="sheetSave">♡ Simpan</button>
      </div>
      <h4 id="epLabel">Episode</h4>
      <div class="eps" id="epList"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
