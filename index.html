<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>animehub — v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a class="logo" href="#">animehub<span>.</span></a>
  <label class="search"><span>⌕</span><input id="q" type="text" placeholder="Cari judul…" autocomplete="off"></label>
  <button class="koleksi-btn" id="koleksiBtn">♡ <b id="wlCount">0</b></button>
</header>

<main>
  <!-- HARI -->
  <section class="dayhead">
    <p class="kicker" id="dateLine">HARI INI</p>
    <h1 id="dayName">Senin</h1>
    <p class="sub" id="daySub"></p>
    <div class="days" id="dayPills"></div>
  </section>

  <!-- TAYANG -->
  <section>
    <h2>Tayang <span id="airDay">hari ini</span></h2>
    <div class="air" id="airRow"></div>
  </section>

  <!-- LANJUTKAN -->
  <section>
    <h2>Lanjutkan</h2>
    <div class="rail" id="contRow"></div>
  </section>

  <!-- SEMUA -->
  <section>
    <div class="sec-row"><h2>Semua judul</h2></div>
    <div class="chips" id="catChips">
      <button class="chip on" data-cat="semua">Semua</button>
      <button class="chip" data-cat="anime">Anime</button>
      <button class="chip" data-cat="donghua">Donghua</button>
      <button class="chip" data-cat="manga">Manga</button>
    </div>
    <p class="hint" id="hint" hidden></p>
    <div class="grid" id="grid"></div>
  </section>

  <!-- KOLEKSI -->
  <section id="wlSection" hidden>
    <h2>Koleksiku</h2>
    <div class="grid" id="wlGrid"></div>
  </section>

  <p class="foot-note">mockup v3 — konten placeholder</p>
</main>

<!-- DETAIL -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet">
    <button class="close" id="closeSheet">✕</button>
    <div class="sheet-top">
      <div class="sheet-art" id="sheetArt"></div>
      <div>
        <span class="pill" id="sheetCat">ANIME</span>
        <h3 id="sheetTitle"></h3>
        <p class="meta" id="sheetMeta"></p>
        <p class="syn" id="sheetSyn"></p>
        <div class="sheet-actions">
          <button class="btn-primary" id="sheetWatch">▶ Mulai</button>
          <button class="btn-ghost" id="sheetSave">♡ Simpan</button>
        </div>
      </div>
    </div>
    <h4 id="epLabel">Episode</h4>
    <div class="eps" id="epList"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
